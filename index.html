<!doctype html>
<!-- Dark Glass é o padrão; ThemeProvider restaura a preferência antes do paint React. -->
<html lang="pt-BR" data-ui-theme="dark" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- `viewport-fit=cover` faz o canvas ocupar tambem a area sob o notch em
         celular. Zoom por pinca continua PERMITIDO de proposito: o jogo tem
         controle de zoom proprio, mas bloquear o do navegador quebra quem
         precisa ampliar pra ler. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- O jogo mudou de endereco junto com o nome (Poke Inspiration). O projeto
         antigo do Pages continua publicando o staging (dev.poke-hunt-euj), entao
         so a producao antiga redireciona, levando caminho, busca e hash (o hash
         carrega o token do link de recuperacao de senha). Primeira coisa do
         head para nao baixar o jogo inteiro antes de sair. -->
    <script>
      if (location.hostname === 'poke-hunt-euj.pages.dev')
        location.replace('https://jogar-pokeinspiration.pages.dev' + location.pathname + location.search + location.hash)
    </script>

    <title>Poke Inspiration — idle de captura e batalha no navegador</title>
    <meta
      name="description"
      content="Jogo de fã grátis no navegador: escolha seu inicial, explore as hunts e evolua sua equipe — a caçada roda sozinha enquanto o jogo está aberto."
    />
    <!-- URL de produção fixa de propósito: o deploy de dev aponta o canonical
         para produção, então o buscador indexa uma cópia só. -->
    <link rel="canonical" href="https://jogar-pokeinspiration.pages.dev/" />
    <!-- Verificação do Google Search Console. Metatag em vez de arquivo .html:
         o Pages redireciona /x.html para /x e a verificação por arquivo falha.
         Remover desfaz a verificação da propriedade. -->
    <meta name="google-site-verification" content="dn0iuu5wJcGRs31kNptcX1s6aqDvLkqpDbjsOfSd2U4" />
    <!-- Cor da barra do navegador no celular. Sem isto ela fica clara, brigando
         com o jogo inteiro escuro. Mesmo valor de --background do index.css. -->
    <meta name="theme-color" content="#0a0a0a" />

    <!-- Previa ao compartilhar o link. Sem isto o link sai "pelado" em
         WhatsApp/Discord, que e como um jogo web costuma circular. A imagem
         precisa de URL absoluta: WhatsApp e Discord ignoram caminho relativo. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Poke Inspiration" />
    <meta property="og:title" content="Poke Inspiration" />
    <meta
      property="og:description"
      content="Idle de captura e batalha automática no navegador. A caçada roda sozinha enquanto o jogo está aberto."
    />
    <meta property="og:url" content="https://jogar-pokeinspiration.pages.dev/" />
    <meta property="og:image" content="https://jogar-pokeinspiration.pages.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Dados estruturados: o Google so considera VideoGame em resultado rico
         quando vem junto de outro tipo de app, dai o par com WebApplication. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": ["VideoGame", "WebApplication"],
        "name": "Poke Inspiration",
        "url": "https://jogar-pokeinspiration.pages.dev/",
        "description": "Jogo de fã grátis no navegador: idle de captura e batalha automática.",
        "genre": ["Idle", "RPG"],
        "inLanguage": "pt-BR",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Navegador",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "BRL" }
      }
    </script>

    <!-- O app fala com o Supabase (auth + Edge Function) no primeiro instante
         do carregamento, e e outra origem: sem isto, o navegador so comeca DNS
         e TLS quando a primeira chamada acontece. `crossorigin` e obrigatorio —
         sem ele o preconnect abre uma conexao anonima que as requests com
         credencial nao reaproveitam, e o custo seria pago duas vezes.
         `%VITE_SUPABASE_URL%` e substituido pelo Vite no build, entao isto
         acompanha o ambiente em vez de fixar um projeto. -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <link rel="dns-prefetch" href="%VITE_SUPABASE_URL%" />
  </head>
  <body>
    <div id="root"></div>
    <!-- O jogo inteiro e JavaScript: sem ele o jogador veria uma pagina branca e
         nenhuma explicacao. -->
    <noscript>
      <div style="padding: 2rem; font-family: system-ui, sans-serif; color: #fafafa">
        <h1>Poke Inspiration</h1>
        <p>Este jogo precisa de JavaScript para rodar. Ative-o e recarregue a pagina.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
