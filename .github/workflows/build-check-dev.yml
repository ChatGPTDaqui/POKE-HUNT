name: Build check (PR)

# Gate de tsc+testes pra feature branches virando dev -- nao existia CI
# nenhum de build/teste antes disso, so o gate especifico de Supabase
# (supabase-check.yml). Espelha o que "npm run build" + "npm test" fariam
# local, mas roda antes do merge real (docs/15, Parte 3, fluxo PR
# feature->dev).
#
# PH-297: RODA NA PROMOCAO PRA MAIN TAMBEM, e isso e o que faltava.
#
# Ate aqui ele so disparava em PR pra `dev`. O unico gate da `main` era o
# `check` do Supabase — migration orfa, par dev/public, `database.types.ts` —,
# nada de build nem de teste. Ou seja: `tsc` quebrado entrava em PRODUCAO com os
# checks verdes, e quem segurava a porta era a aprovacao humana.
#
# Com o fim do review manual (decisao do dono do projeto, 30/08) essa aprovacao
# sai de cena. O CI passa a ser o unico revisor, e revisor que nao olha o build
# nao e revisor. Este `on:` e o passo 1 dos quatro da PH-297: sem ele, marcar
# `build-check` como obrigatorio na `main` travaria a promocao esperando um
# check que nunca chegaria.
#
# O NOME DO JOB (`build-check`, logo abaixo) NAO MUDA: e ele o `context` que os
# rulesets referenciam. Quem deixou de citar `dev` foi o `name:` do workflow, que
# agora vale pros dois destinos.
on:
  pull_request:
    branches: [dev, main]

jobs:
  build-check:
    runs-on: ubuntu-latest
    env:
      # Placeholder -- so pra passar o guard "Supabase nao configurado" em
      # src/lib/supabase.ts. `.invalid` e TLD reservado (RFC 2606): nunca
      # resolve em lugar nenhum, ao contrario de um subdominio *.supabase.co
      # fake, que cai na infra real (wildcard DNS) e se comporta diferente
      # em runner com internet (CI) vs sandbox sem internet (local).
      VITE_SUPABASE_URL: https://placeholder.invalid
      VITE_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      - run: cd authority && npm ci

      - name: Buildar #engine (authority/ nao resolve sem isto -- ver CLAUDE.md)
        run: npm run build:engine

      - name: Typecheck raiz (motor, cliente)
        run: npx tsc -b --force

      - name: Typecheck authority (servico de autoridade)
        run: cd authority && npx tsc --noEmit

      - name: Testes raiz
        run: npm test

      - name: Testes authority
        run: cd authority && npx vitest run
