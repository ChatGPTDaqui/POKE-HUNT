name: Supabase check

# Gate de PR/push. Pega os 2 incidentes que ja aconteceram por falta disso:
# - migration criada e nunca aplicada (schema remoto diverge do que os
#   arquivos em supabase/migrations/ esperam)
# - front rodando contra schema desatualizado (database.types.ts nao
#   regenerado depois de uma mudanca de coluna/tabela)
#
# Roda num runner do GitHub (tem Docker disponivel) — nao e o mesmo ambiente
# que a maquina local, que evita Docker de proposito (ver docs/11-operacao.md).

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # precisa do historico completo pro git diff contra a base mais abaixo

      - name: PR pra main so pode vir de dev
        # Reforco do fluxo feature->dev->main (docs/15, Parte 3): so vira gate
        # de verdade combinado com branch protection marcando este check como
        # obrigatorio (pendente — precisa de admin no repo, ver docs/15).
        # Sem isso, um PR de feature branch reto pra main (o mesmo erro que
        # ja aconteceu 2x nesta sessao) passa sem aviso nenhum.
        if: github.event_name == 'pull_request' && github.head_ref != 'dev'
        run: |
          echo "::error::PR para main so e permitido a partir da branch dev (esta PR vem de '${{ github.head_ref }}'). Merge sua feature branch em dev primeiro, teste em jogo-dev, so depois abra PR dev->main."
          exit 1

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link no projeto Supabase
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Existe migration aplicada no remoto que nao existe local?
        # NAO usa 'db diff' — ele reconstroi o banco do zero so com as
        # migrations do repo (shadow database), e esse rebuild esta quebrado
        # pra este projeto: o schema `dev` (~30 tabelas) foi clonado de
        # `public` fora da trilha de migration muito antes de qualquer
        # convencao de arquivo _dev existir, entao o replay historico falha
        # ("schema dev does not exist") pra QUALQUER schema, nao so dev.
        # Consertar isso e cirurgia de historico, fora de escopo aqui.
        #
        # 'migration list --linked' faz a pergunta certa sem precisar
        # reconstruir nada: compara os arquivos locais contra o que o
        # Supabase tem registrado como aplicado.
        #
        # ---------------------------------------------------------------
        # PH-76: ORFA PENDENTE DE MERGE NAO E O MESMO QUE DDL NA MAO
        # ---------------------------------------------------------------
        # O passo 3 de docs/11-operacao.md manda aplicar `db push` DA BRANCH
        # DE FEATURE, antes do PR. Enquanto essa PR nao mergear, o arquivo
        # existe so nela — e pra todas as outras branches aquela migration
        # aparece como orfa. Reprovar ai fazia seguir o fluxo documentado
        # travar o CI de todo mundo: 26 PRs reprovadas de uma vez em 22/08,
        # nenhuma delas mexendo em schema.
        #
        # A distincao e barata e objetiva: orfa legitima tem arquivo em
        # ALGUMA branch do repositorio; DDL aplicada na mao (o incidente que
        # o gate existe pra pegar, PH-32) nao tem em nenhuma.
        #
        # E nao aborta o job: a falha vai pro passo final, pros passos de par
        # dev/public e de types RODAREM mesmo havendo orfa pendente. Antes
        # eles ficavam inacessiveis atras deste, justo quando ha mudanca de
        # schema em voo — que e quando mais importam.
        run: |
          # 'migration list --linked' flanca a conexao ocasionalmente (visto
          # 2x em 25/08: falha em ~30s sem imprimir nada, run seguinte no
          # MESMO commit passa normal em minutos) -- retry pra nao reprovar
          # PR por instabilidade de rede, nao por orfa de verdade.
          LISTA=""
          for tentativa in 1 2 3; do
            if LISTA=$(supabase migration list --linked --output-format json); then
              break
            fi
            echo "::warning::Tentativa ${tentativa}/3 de 'migration list --linked' falhou (provavel flake de conexao). Retentando..."
            sleep 5
          done
          if [ -z "$LISTA" ]; then
            echo "::error::'supabase migration list --linked' falhou 3x seguidas -- isto e falha de conexao/CLI, nao o gate de migration orfa. Ver logs do step."
            exit 1
          fi
          echo "$LISTA" | jq -c '.migrations[]'
          ORFAS=$(echo "$LISTA" | jq -r '.migrations[] | select(.local == "") | .remote')
          if [ -z "$ORFAS" ]; then
            echo "Toda migration aplicada no remoto tem arquivo local correspondente."
            exit 0
          fi
          # --tags pra alcancar tambem o que so existe em tag; --force porque
          # refs podem ter sido reescritas por rebase em branch de feature.
          git fetch --all --tags --force --quiet
          ARQUIVOS_EM_QUALQUER_BRANCH=$(git log --all --diff-filter=A --name-only --pretty=format: -- supabase/migrations/ | sort -u)
          FALHOU=0
          for versao in $ORFAS; do
            if echo "$ARQUIVOS_EM_QUALQUER_BRANCH" | grep -q "^supabase/migrations/${versao}_"; then
              echo "::warning::Migration ${versao} esta aplicada no remoto e pendente de merge (o arquivo existe em outra branch). Nao e bloqueio: e a janela normal do passo 3 do fluxo de schema."
            else
              echo "::error::Migration ${versao} esta aplicada no banco remoto e NAO tem arquivo em nenhuma branch — isto e DDL aplicada na mao (db query, dashboard ou apply_migration sem commitar)."
              echo "  Resolver: reconstruir o .sql com o MESMO timestamp e registrar com 'supabase migration repair --status applied ${versao}'."
              echo "  NAO rode 'migration repair --status reverted' — o CLI as vezes sugere isso, e marcaria como revertida uma migration que esta de fato aplicada. O deploy seguinte tentaria recriar objeto que ja existe e quebraria."
              FALHOU=1
            fi
          done
          echo "ORFA_APLICADA_NA_MAO=$FALHOU" >> "$GITHUB_ENV"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Migration nova mexe em dev sem mexer em public (ou vice-versa)?
        # Convencao do projeto (ver supabase/migrations/2026081*): mudanca de
        # schema em dev/public anda em par. Nada impede hoje commitar so um
        # lado — silencioso ate os 2 ambientes divergirem de verdade.
        # So olha migrations NOVAS neste push/PR (nao mexe no historico, que
        # e de antes dessa convencao existir).
        #
        # Base do diff varia por trigger (achado do pente fino, docs/15 Parte 3):
        # PR pra main compara contra main (exige par completo, e o ponto real
        # de promocao pra producao). Push fora de main (feature branch ou dev)
        # compara contra dev — um commit so-`_dev.sql` precisa passar livre
        # ali, o par so e cobrado quando vira PR dev->main.
        run: |
          git fetch origin main dev --depth=50
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            BASE=origin/main
          else
            BASE=origin/dev
          fi
          NOVAS=$(git diff --name-only --diff-filter=A "$BASE"...HEAD -- supabase/migrations/)
          if [ -z "$NOVAS" ]; then
            echo "Nenhuma migration nova neste push/PR."
            exit 0
          fi
          TOCA_DEV=""
          TOCA_PUBLIC=""
          for f in $NOVAS; do
            if grep -qE '\bdev\.[a-zA-Z_]' "$f"; then TOCA_DEV="$TOCA_DEV $f"; fi
            if grep -qE '\bpublic\.[a-zA-Z_]' "$f"; then TOCA_PUBLIC="$TOCA_PUBLIC $f"; fi
          done
          if [ -n "$TOCA_DEV" ] && [ -z "$TOCA_PUBLIC" ]; then
            echo "::error::Migration nova mexe em dev.* mas nenhuma mexe em public.* — falta o par:$TOCA_DEV"
            exit 1
          fi
          if [ -n "$TOCA_PUBLIC" ] && [ -z "$TOCA_DEV" ]; then
            echo "::error::Migration nova mexe em public.* mas nenhuma mexe em dev.* — falta o par:$TOCA_PUBLIC"
            exit 1
          fi
          echo "Par dev/public ok (ou migration nao mexe em nenhum dos dois, ex: grant/extensao)."

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: database.types.ts esta desatualizado?
        run: |
          npm ci
          supabase gen types typescript --linked > /tmp/database.types.ts
          if ! diff -q /tmp/database.types.ts src/lib/database.types.ts > /dev/null; then
            echo "::error::src/lib/database.types.ts esta desatualizado em relacao ao schema remoto."
            echo "Rode 'npm run db:types' local e commite o resultado junto da migration."
            diff /tmp/database.types.ts src/lib/database.types.ts || true
            exit 1
          fi
          echo "database.types.ts em sincronia com o schema remoto."
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Resultado do gate
        # Roda SEMPRE (inclusive se um passo anterior falhou) pra transformar a
        # orfa aplicada na mao em reprovacao — o passo que a detecta nao aborta
        # de proposito, pros passos de par dev/public e de types rodarem.
        if: always()
        run: |
          if [ "${ORFA_APLICADA_NA_MAO:-0}" = "1" ]; then
            echo "::error::Reprovado: ha migration aplicada no banco remoto sem arquivo em nenhuma branch. Veja o passo 'Existe migration aplicada no remoto que nao existe local?'."
            exit 1
          fi
          echo "Gate ok."
