name: Supabase check

on:
  pull_request:
    branches: [dev, main]
  schedule:
    - cron: '20 9 * * *'

# Só validações da mesma PR podem ser substituídas. Deploys têm grupos próprios.
concurrency:
  group: supabase-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SCHEMA_BASE: ${{ github.base_ref == 'main' && 'origin/main' || 'origin/dev' }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'schedule' && 'dev' || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22.22.2
      - uses: supabase/setup-cli@v2
        with:
          version: 2.116.0

      - name: Promocao somente de dev
        if: github.base_ref == 'main' && github.head_ref != 'dev'
        run: |
          echo '::error::Promocao para main deve vir de dev.'
          exit 1

      - name: Validar historico, ordem, pares e escopo
        id: plan
        run: node scripts/ci/schema-plan.mjs

      - name: Conferir migrations remotas sem arquivo versionado
        run: |
          if ! scripts/ci/supabase-cli.sh supabase migration list --linked --output-format json > schema-remote.json; then
            echo "::error::CLI falhou em todas as tentativas; falha de conexao/credencial, nao migration orfa."
            exit 1
          fi
          if ! jq -e 'has("migrations") and (.migrations | type == "array")' schema-remote.json > /dev/null 2>&1; then
            echo "::error::CLI respondeu sem '.migrations' como array; formato invalido, NAO e o gate de migration orfa."
            head -c 2000 schema-remote.json
            exit 1
          fi
          FALHOU=0
          ARQUIVOS=$(git log --all --diff-filter=A --name-only --pretty=format: -- supabase/migrations/ | sort -u)
          for versao in $(jq -r '.migrations[] | select(.local == "") | .remote' schema-remote.json); do
            if echo "$ARQUIVOS" | grep -q "^supabase/migrations/${versao}_"; then
              echo "::warning::Migration $versao existe no historico de outra branch; reconciliar com a base."
            else
              echo "::error::Migration $versao aplicada sem arquivo em qualquer branch. Reconciliar sem marcar como revertida uma migration ainda aplicada."
              FALHOU=1
            fi
          done
          [ "$FALHOU" = 0 ]

      - name: Preparar baseline comprovada para PR de schema ou mudanca do harness
        if: github.base_ref != 'main' && (steps.plan.outputs.schema == 'true' || steps.plan.outputs.harness == 'true')
        run: node scripts/ci/schema-plan.mjs baseline

      - name: Aplicar migrations e verificar tipos somente no banco descartavel
        if: github.base_ref != 'main' && (steps.plan.outputs.schema == 'true' || steps.plan.outputs.harness == 'true')
        run: bash scripts/ci/schema-sandbox.sh

      - name: Gate de promocao e monitor de drift
        if: github.base_ref == 'main' || github.event_name == 'schedule'
        run: |
          scripts/ci/supabase-cli.sh supabase gen types typescript --linked > database.types.regenerado.ts
          sed -E 's/PostgrestVersion: "[^"]*"/PostgrestVersion: "NORMALIZADO"/' database.types.regenerado.ts > /tmp/gerado.norm.ts
          sed -E 's/PostgrestVersion: "[^"]*"/PostgrestVersion: "NORMALIZADO"/' src/lib/database.types.ts > /tmp/commitado.norm.ts
          if ! diff -u /tmp/commitado.norm.ts /tmp/gerado.norm.ts; then
            echo '::error::Drift entre schema remoto e tipos. A promocao permanece bloqueada; corrija na PR responsavel pelo schema.'
            exit 1
          fi

      - name: Guardar tipos para corrigir a mesma PR
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: database.types.ts
          path: |
            database.types.regenerado.ts
            schema-baseline.types.ts
            schema-base.types.ts
          if-no-files-found: ignore
